[project]
name = "propelauth-flask"
version = "4.5.0"
description = "A library for managing authentication in Flask"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PropelAuth", email = "support@propelauth.com" }]
dependencies = ["propelauth-py==4.5.0", "requests", "httpx>=0.28.1", "flask<4"]

[project.urls]
Homepage = "https://github.com/propelauth/propelauth-flask"

[dependency-groups]
dev = ["pytest", "requests-mock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
no-build = false
exclude-newer-package = { propelauth-py = false }

[tool.hatch.build.targets.wheel]
packages = ["propelauth_flask"]
